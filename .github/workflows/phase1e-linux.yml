name: Networking Linux validation

on:
  push:
    branches:
      - main
      - phase1e/linux-epoll
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-epoll:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Linux toolchain
        run: |
          set -euo pipefail
          uname -a
          cmake --version
          ninja --version
          c++ --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Discover tests
        run: ctest --preset ${{ matrix.preset }} -N

      - name: Run full test suite
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Repeat connection lifecycle integration tests
        run: |
          ctest \
            --test-dir build/${{ matrix.preset }} \
            -R '^(integration\\.connection_manager|integration\\.connection_dispatch)$' \
            --repeat until-fail:20 \
            --output-on-failure

      - name: Repeat native epoll integration test
        run: |
          ctest \
            --test-dir build/${{ matrix.preset }} \
            -R '^integration\.epoll$' \
            --repeat until-fail:15 \
            --output-on-failure

      - name: Verify build version
        run: ./build/${{ matrix.preset }}/redisdb-server --version
