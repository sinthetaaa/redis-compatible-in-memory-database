name: Networking Linux validation

on:
  push:
    branches:
      - main
      - phase1e/linux-epoll
      - 'phase*/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-epoll:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Linux toolchain
        run: |
          set -euo pipefail
          uname -a
          cmake --version
          ninja --version
          c++ --version

      - name: Install redis-cli for compatibility regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends redis-tools
          command -v redis-cli

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2

      - name: Discover tests
        run: ctest --preset ${{ matrix.preset }} -N

      - name: Run full test suite
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Repeat RESP2 pipeline regressions
        run: |
          set -euo pipefail

          pattern='^integration[.](resp_pipeline|resp_pipeline_dispatch|resp_pipeline_scheduler_hardening)$'

          ctest \
            --test-dir build/${{ matrix.preset }} \
            -N \
            -R "$pattern" \
            | tee "$RUNNER_TEMP/phase2e-selected-tests.txt"

          # Never accept a green run that discovers
          # fewer than the three pipeline targets.
          grep -Eq \
            '^[[:space:]]*Total Tests: 3[[:space:]]*$' \
            "$RUNNER_TEMP/phase2e-selected-tests.txt"

          ctest \
            --test-dir build/${{ matrix.preset }} \
            -R "$pattern" \
            --repeat until-fail:20 \
            --output-on-failure

      - name: Repeat external TCP server smoke test
        run: |
          set -euo pipefail

          pattern='^integration[.]server_smoke$'

          ctest \
            --test-dir build/${{ matrix.preset }} \
            -N \
            -R "$pattern" \
            | tee "$RUNNER_TEMP/phase1g-selected-tests.txt"

          grep -Eq \
            '^[[:space:]]*Total Tests: 1[[:space:]]*$' \
            "$RUNNER_TEMP/phase1g-selected-tests.txt"

          ctest \
            --test-dir build/${{ matrix.preset }} \
            -R "$pattern" \
            --repeat until-fail:10 \
            --output-on-failure

      - name: Repeat connection lifecycle integration tests
        run: |
          set -euo pipefail

          # Explicit literal-dot matching avoids shell
          # and YAML backslash-escaping mistakes.
          pattern='^integration[.](connection_manager|connection_dispatch)$'

          ctest \
            --test-dir build/${{ matrix.preset }} \
            -N \
            -R "$pattern" \
            | tee "$RUNNER_TEMP/phase1f-selected-tests.txt"

          # A green job with zero selected tests is
          # not a valid acceptance result.
          grep -Eq             '^[[:space:]]*Total Tests: 2[[:space:]]*$'             "$RUNNER_TEMP/phase1f-selected-tests.txt"

          ctest \
            --test-dir build/${{ matrix.preset }} \
            -R "$pattern" \
            --repeat until-fail:20 \
            --output-on-failure

      - name: Repeat native epoll integration test
        run: |
          ctest \
            --test-dir build/${{ matrix.preset }} \
            -R '^integration\.epoll$' \
            --repeat until-fail:15 \
            --output-on-failure

      - name: Verify build version
        run: ./build/${{ matrix.preset }}/redisdb-server --version
